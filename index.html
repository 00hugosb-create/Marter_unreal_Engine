<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Máster Unreal Engine · Organizador</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1b1b1a;--mu:#6b6b66;--bd:#e2e2dd;--ac:#c8501e;--ac2:#fbe9e1;--ok:#2f8f5b;--wa:#d99a1b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171716;--card:#222221;--tx:#ececE8;--mu:#9a9a94;--bd:#33332f;--ac:#ef7a4a;--ac2:#3a2519;--ok:#4cc380;--wa:#e8b441}}
:root[data-theme=dark]{--bg:#171716;--card:#222221;--tx:#ececE8;--mu:#9a9a94;--bd:#33332f;--ac:#ef7a4a;--ac2:#3a2519;--ok:#4cc380;--wa:#e8b441}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1000px;margin:0 auto}
h1{font-size:17px;margin:0;flex:1 1 auto;white-space:nowrap}
.btn{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.search{max-width:1000px;margin:10px auto 0;display:flex;gap:8px}
.search input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.search input:focus{outline:2px solid var(--ac);border-color:transparent}
.chips{max-width:1000px;margin:8px auto 0;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--mu)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.gp{max-width:1000px;margin:8px auto 0;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mu)}
.bar{flex:1;height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
main{max-width:1000px;margin:0 auto;padding:14px 16px 60px}
.bl{margin:20px 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:10px}
.bl .bar{max-width:160px}
details.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:8px 0;overflow:hidden}
details.sec>summary{cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--mu);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
.sec .cnt{margin-left:auto;font-weight:400;color:var(--mu);font-size:12px;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--bd)}
.row:hover{background:var(--ac2)}
.row.done .tt{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--bd)}
.tt{flex:1;cursor:pointer;min-width:0}
.grp{padding:8px 14px 4px;border-top:1px solid var(--bd);font-size:12px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.03em}
.st{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);background:none;cursor:pointer;color:var(--mu);font-size:14px;line-height:1;flex:none}
.st.s1{color:var(--wa);border-color:var(--wa)}.st.s2{color:var(--ok);border-color:var(--ok)}
.ic{background:none;border:0;cursor:pointer;color:var(--bd);font-size:16px;padding:2px 4px}
.ic.on{color:var(--wa)}.ic.has{color:var(--ac)}
.bdg{font-size:10.5px;border-radius:5px;padding:1px 6px;margin-left:8px;background:var(--ac2);color:var(--ac);vertical-align:1px}
.tag{font-size:11px;border:1px solid var(--bd);border-radius:5px;padding:0 5px;margin-left:5px;color:var(--mu)}
.res{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:10px 0;padding:10px 14px}
.res h3{margin:0 0 2px;font-size:14.5px;cursor:pointer}.res .sub{font-size:12px;color:var(--mu);margin-bottom:6px}
.snip{display:flex;gap:10px;padding:5px 0;border-top:1px dashed var(--bd);cursor:pointer;font-size:13.5px}
.snip:hover{background:var(--ac2)}.snip b.t{flex:none;color:var(--ac);font-variant-numeric:tabular-nums;min-width:48px}
mark{background:#ffe08a;color:#222;border-radius:3px;padding:0 1px}
.empty{color:var(--mu);text-align:center;padding:40px 0}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:0;width:min(720px,94vw);max-height:90vh}
dialog::backdrop{background:#0008}
.dh{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:flex-start}
.dh h2{margin:0;font-size:16px;flex:1}.dh small{display:block;color:var(--mu);font-weight:400;margin-top:2px}
.db{padding:14px 18px;overflow:auto;max-height:68vh}
.db label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}
.db textarea,.db input[type=text],.db select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.db textarea{min-height:90px;resize:vertical}
.cues{max-height:260px;overflow:auto;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.cue{display:flex;gap:10px;padding:4px 10px;font-size:13.5px}.cue.hit{background:var(--ac2)}.cue b{flex:none;color:var(--ac);min-width:48px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px}.seg .btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hint{font-size:12.5px;color:var(--mu)}
.um{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0;align-items:center;font-size:13px}
@media(max-width:640px){h1{font-size:15px}.um{grid-template-columns:1fr}}
</style>
</head>

/* ---------- parseo de transcripciones ---------- */
function parseTime(s){const m=s.trim().match(/(?:(\d+):)?(\d+):(\d+)(?:[.,](\d+))?/);if(!m)return null;return (+(m[1]||0))*3600+(+m[2])*60+(+m[3])+(m[4]?+('0.'+m[4]):0)}
function fmt(t){if(t==null)return '';t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}
function parseTranscript(name,text){
 text=text.replace(/^﻿/,'').replace(/\r/g,'');
 if(/\.json$/i.test(name)){try{const j=JSON.parse(text);const arr=Array.isArray(j)?j:(j.segments||j.chunks||[]);
  if(arr.length)return arr.map(x=>({t:x.start!=null?+x.start:(Array.isArray(x.timestamp)?x.timestamp[0]:null),text:String(x.text||'').trim()})).filter(c=>c.text);
  if(j.text)text=String(j.text)}catch(e){}}
 if(text.includes('-->')){const cues=[];for(const blk of text.split(/\n\s*\n/)){const ls=blk.split('\n').filter(l=>l.trim()!=='');const i=ls.findIndex(l=>l.includes('-->'));if(i<0)continue;
  const t=parseTime(ls[i].split('-->')[0]);const tx=ls.slice(i+1).join(' ').replace(/<[^>]+>/g,'').trim();if(tx)cues.push({t,text:tx})}return cues}
 return text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?\s*(.*)$/);return m&&m[2]?{t:parseTime(m[1]),text:m[2]}:{t:null,text:l}})
}
const tokens=s=>norm(s).replace(/\.{2,}|…/g,' ').replace(/[^a-z0-9]+/g,' ').trim();
function score(fname,title){const a=tokens(fname.replace(/\.[^.]+$/,'')),b=tokens(title);if(!a||!b)return 0;if(a===b)return 1;
 if(b.length>=8&&(a.includes(b)||b.includes(a)))return .9;
 const A=new Set(a.split(' ')),B=new Set(b.split(' '));let i=0;A.forEach(x=>{if(B.has(x))i++});return i/(A.size+B.size-i)}

/* ---------- filtros ---------- */
const FILTERS=[['all','Todos'],['0','Pendientes'],['1','Viendo'],['2','Vistos'],['fav','★ Favoritos'],['note','Con notas'],['tr','Con transcripción'],['pr','Prácticas y tests']];
function passes(it){
 if(!countable(it))return false;
 const st=S.p[it.id]||0,m=S.m[it.id]||{};
 switch(FILTER){case 'all':return true;case '0':return st===0;case '1':return st===1;case '2':return st===2;
  case 'fav':return !!m.fav;case 'note':return !!(m.note&&m.note.trim());case 'tr':return !!TR[it.id];case 'pr':return it.type==='practica'||it.type==='test'}
 return true}
function renderChips(){document.getElementById('chips').innerHTML=FILTERS.map(([k,l])=>`<span class="chip ${FILTER===k?'on':''}" data-f="${k}">${l}</span>`).join('')}

/* ---------- progreso ---------- */
function prog(items){const c=items.filter(countable);const d=c.filter(i=>(S.p[i.id]||0)===2).length;return {d,t:c.length,pct:c.length?Math.round(d/c.length*100):0}}
function renderGlobal(){const g=prog(ALL);document.getElementById('gtxt').textContent=`${g.d} / ${g.t} vistos (${g.pct}%)`;document.getElementById('gbar').style.width=g.pct+'%'}

/* ---------- render ---------- */
function badge(it){return it.type==='practica'?'<span class="bdg">práctica</span>':it.type==='test'?'<span class="bdg">test</span>':it.type==='recurso'?'<span class="bdg">recurso</span>':''}
function row(it,hl){
 const st=S.p[it.id]||0,m=S.m[it.id]||{};
 const tags=(m.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('');
 return `<div class="row ${st===2?'done':''}" data-id="${it.id}">
 <button class="st s${st}" data-act="st" title="${STN[st]} (clic para cambiar)">${STI[st]}</button>
 <div class="tt" data-act="open">${esc(clean(it.title))}${badge(it)}${tags}</div>
 ${TR[it.id]?'<span title="Tiene transcripción">📝</span>':''}
 <button class="ic ${m.note&&m.note.trim()?'has':''}" data-act="open" title="Notas">✎</button>
 <button class="ic ${m.fav?'on':''}" data-act="fav" title="Favorito">★</button></div>`}

function renderTree(){
 const out=[];let lastB='';
 DATA.forEach(s=>{
  let html='',shown=0,pendG='';
  s.items.forEach(it=>{
   if(it.type==='group'){pendG=`<div class="grp">${esc(clean(it.title))}</div>`;return}
   if(!passes(it))return;
   if(pendG){html+=pendG;pendG=''}
   html+=row(it);shown++});
  if(!shown)return;
  const p=prog(s.items);
  if(s.bloque!==lastB){lastB=s.bloque;const bp=prog(ALL.filter(i=>i.sec.bloque===s.bloque));
   out.push(`<div class="bl">${BLOQUES[s.bloque]}<div class="bar"><i style="width:${bp.pct}%"></i></div><span>${bp.d}/${bp.t}</span></div>`)}
  const open=OPEN.has(s.id)||FILTER!=='all';
  out.push(`<details class="sec" data-sid="${s.id}" ${open?'open':''}><summary>${esc(clean(s.title))}<span class="cnt">${p.d}/${p.t}</span></summary>${html}</details>`)});
 return out.join('')||'<div class="empty">Nada que mostrar con este filtro.</div>'}

function searchWords(q){return norm(q).split(/\s+/).filter(Boolean)}
function findHits(t,q){const nq=norm(q.trim());const hits=[];if(!nq||!t)return hits;let i=-1,last=-1;
 while((i=t.full.indexOf(nq,i+1))!==-1&&hits.length<400){let lo=0,hi=t.off.length-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(t.off[mid]<=i)lo=mid;else hi=mid-1}
  if(lo!==last){hits.push(lo);last=lo}}
 return hits}
function hl(text,q){const ws=searchWords(q).filter(w=>w.length>1);if(!ws.length)return esc(text);
 const nt=norm(text);let ranges=[];const nq=norm(q.trim());
 const addAll=w=>{let i=-1;while((i=nt.indexOf(w,i+1))!==-1){ranges.push([i,i+w.length])}};
 const before=ranges.length;addAll(nq);if(ranges.length===before)ws.forEach(addAll);
 ranges.sort((a,b)=>a[0]-b[0]);let res='',p=0;
 if(nt.length!==text.length)return esc(text);
 for(const [a,b] of ranges){if(a<p)continue;res+=esc(text.slice(p,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';p=b}
 return res+esc(text.slice(p))}

function renderSearch(){
 const ws=searchWords(Q);const out=[];let n=0;
 ALL.forEach(it=>{
  if(!countable(it)||!passes(it))return;
  const titleHit=ws.every(w=>it.n.includes(w));
  const hits=TR[it.id]?findHits(TR[it.id],Q):[];
  if(!titleHit&&!hits.length)return;n++;
  const snips=hits.slice(0,5).map(ci=>{const c=TR[it.id].cues[ci];return `<div class="snip" data-id="${it.id}" data-cue="${ci}"><b class="t">${fmt(c.t)||'·'}</b><span>${hl(c.text,Q)}</span></div>`}).join('');
  out.push(`<div class="res"><h3 data-id="${it.id}" data-act="open">${hl(clean(it.title),Q)}${badge(it)}</h3>
  <div class="sub">${esc(BLOQUES[it.sec.bloque])} › ${esc(clean(it.sec.title))}${hits.length?` · ${hits.length} coincidencia${hits.length>1?'s':''} en transcripción`:''}</div>${snips}${hits.length>5?`<div class="hint" style="padding-top:4px">+${hits.length-5} más (ábrelo para verlas todas)</div>`:''}</div>`)});
 const noTr=Object.keys(TR).length===0;
 return (n?`<div class="hint">${n} vídeo${n>1?'s':''} con resultados${noTr?' · de momento solo busco en títulos: importa transcripciones para buscar dentro de los vídeos':''}</div>`:'')+(out.join('')||`<div class="empty">Sin resultados${noTr?' en títulos. Importa transcripciones para buscar dentro de los vídeos.':'.'}</div>`)}

function render(){
 renderChips();renderGlobal();
 document.getElementById('app').innerHTML = Q.trim()?renderSearch():renderTree()}

/* ---------- detalle ---------- */
const dlg=document.getElementById('dlg');
function openDetail(id,cue){
 const it=BYID[id];if(!it)return;const m=S.m[id]||(S.m[id]={});const st=S.p[id]||0;const t=TR[id];
 const cuesHtml=t?t.cues.map((c,i)=>`<div class="cue" data-i="${i}"><b>${fmt(c.t)||'·'}</b><span>${esc(c.text)}</span></div>`).join(''):'';
 dlg.innerHTML=`<div class="dh"><h2>${esc(clean(it.title))}<small>${esc(BLOQUES[it.sec.bloque])} › ${esc(clean(it.sec.title))}</small></h2><button class="btn" id="dx">Cerrar</button></div>
 <div class="db">
  <div class="seg">${STN.map((n,i)=>`<button class="btn ${st===i?'on':''}" data-s="${i}">${STI[i]} ${n}</button>`).join('')}<button class="btn ${m.fav?'on':''}" id="dfav">★ Favorito</button></div>
  <label>Notas (qué aprendiste, minuto clave, dudas…)</label><textarea id="dnote">${esc(m.note||'')}</textarea>
  <label>Etiquetas (separadas por comas)</label><input type="text" id="dtags" value="${esc((m.tags||[]).join(', '))}" placeholder="lumen, repasar, para el proyecto de Huchu…">
  <label>Transcripción ${t?`· ${esc(t.name)} · ${t.cues.length} líneas`:'· ninguna todavía'}</label>
  ${t?`<input type="text" id="dsearch" placeholder="Buscar dentro de esta transcripción…" style="margin-bottom:6px" value="${esc(Q)}"><div class="cues" id="dcues">${cuesHtml}</div>
  <div style="margin-top:8px;display:flex;gap:6px"><button class="btn" id="dpaste">Reemplazar</button><button class="btn" id="ddel">Quitar</button></div>`
  :`<textarea id="dpastebox" placeholder="Pega aquí la transcripción (con o sin tiempos)…" style="min-height:70px"></textarea><div style="margin-top:6px"><button class="btn" id="dpaste">Guardar transcripción pegada</button> <button class="btn" id="dfile">Elegir archivo…</button></div>`}
 </div>`;
 dlg.showModal();
 const saveMeta=()=>{m.note=document.getElementById('dnote').value;m.tags=document.getElementById('dtags').value.split(',').map(x=>x.trim()).filter(Boolean);save()};
 const close=()=>{saveMeta();dlg.close();render()};
 dlg.querySelector('#dx').onclick=close;
 dlg.onclose=()=>{try{saveMeta()}catch(e){}render()};
 dlg.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{saveMeta();S.p[id]=+b.dataset.s;save();openDetail(id)});
 dlg.querySelector('#dfav').onclick=()=>{saveMeta();m.fav=!m.fav;save();openDetail(id)};
 const filt=()=>{const q=(dlg.querySelector('#dsearch')||{}).value||'';const hits=new Set(findHits(t,q));let first=null;
  dlg.querySelectorAll('.cue').forEach(el=>{const i=+el.dataset.i;const h=q.trim()&&hits.has(i);el.classList.toggle('hit',!!h);
   el.querySelector('span').innerHTML=h?hl(t.cues[i].text,q):esc(t.cues[i].text);if(h&&first==null)first=el});return first};
 if(t){const first=filt();const ds=dlg.querySelector('#dsearch');ds.oninput=()=>{const f=filt();if(f)f.scrollIntoView({block:'center'})};
  const target=cue!=null?dlg.querySelector(`.cue[data-i="${cue}"]`):first;if(target)setTimeout(()=>target.scrollIntoView({block:'center'}),30);
  dlg.querySelector('#ddel').onclick=async()=>{if(confirm('¿Quitar la transcripción de este vídeo?')){await delTR(id);openDetail(id)}};
  dlg.querySelector('#dpaste').onclick=()=>{delTR(id).then(()=>openDetail(id))}}
 else{dlg.querySelector('#dpaste').onclick=async()=>{const v=dlg.querySelector('#dpastebox').value.trim();if(!v)return;await putTR({id,name:'(pegada)',cues:parseTranscript('x.txt',v)});openDetail(id)};
  dlg.querySelector('#dfile').onclick=()=>{ONEFILE=id;fTr.click()}}
}
let ONEFILE=null;

/* ---------- importación masiva ---------- */
const fTr=document.getElementById('fTr');
fTr.onchange=async()=>{
 const files=[...fTr.files];fTr.value='';if(!files.length)return;
 const single=ONEFILE;ONEFILE=null;
 const taken=new Set(Object.keys(TR));const un=[];let ok=0;
 for(const f of files){
  const cues=parseTranscript(f.name,await f.text());if(!cues.length){un.push({f,cues,why:'vacío'});continue}
  if(single){await putTR({id:single,name:f.name,cues});ok++;continue}
  let best=null,bs=0;ALL.forEach(it=>{if(!countable(it)||taken.has(it.id))return;const s=score(f.name,it.title);if(s>bs){bs=s;best=it}});
  if(best&&bs>=.6){taken.add(best.id);await putTR({id:best.id,name:f.name,cues});ok++}else un.push({f,cues})}
 if(single){openDetail(single);return}
 if(!un.length){render();alert(`${ok} transcripciones asociadas automáticamente.`);return}
 showUnmatched(un,ok)};
function showUnmatched(un,ok){
 const opts='<option value="">— no asociar —</option>'+DATA.map(s=>`<optgroup label="${esc(clean(s.title))}">${s.items.filter(countable).map(i=>`<option value="${i.id}">${esc(clean(i.title))}</option>`).join('')}</optgroup>`).join('');
 dlg.innerHTML=`<div class="dh"><h2>Asociar transcripciones<small>${ok} asociadas solas · ${un.length} necesitan que elijas vídeo</small></h2><button class="btn" id="dx">Cerrar</button></div>
 <div class="db">${un.map((u,i)=>`<div class="um"><span>${esc(u.f.name)}</span><select data-i="${i}">${opts}</select></div>`).join('')}
 <div style="margin-top:12px"><button class="btn pri" id="uok">Guardar asociaciones</button></div></div>`;
 dlg.showModal();dlg.onclose=()=>render();
 dlg.querySelector('#dx').onclick=()=>dlg.close();
 dlg.querySelector('#uok').onclick=async()=>{for(const s of dlg.querySelectorAll('select')){if(s.value){const u=un[+s.dataset.i];if(u.cues.length)await putTR({id:s.value,name:u.f.name,cues:u.cues})}}dlg.close()}}

/* ---------- copia de seguridad ---------- */
document.getElementById('bBak').onclick=()=>{
 dlg.innerHTML=`<div class="dh"><h2>Copia de seguridad<small>Estados, notas, etiquetas y favoritos</small></h2><button class="btn" id="dx">Cerrar</button></div>
 <div class="db"><p class="hint">Tus datos viven en este navegador. Descarga una copia de vez en cuando o antes de borrar datos del navegador. Las transcripciones no van en la copia: se reimportan desde tus archivos.</p>
 <button class="btn pri" id="bexp">Descargar copia</button> <button class="btn" id="bimp">Restaurar copia…</button></div>`;
 dlg.showModal();dlg.onclose=()=>{};
 dlg.querySelector('#dx').onclick=()=>dlg.close();
 dlg.querySelector('#bexp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='master-unreal-progreso.json';a.click()};
 dlg.querySelector('#bimp').onclick=()=>document.getElementById('fBak').click()};
document.getElementById('fBak').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const j=JSON.parse(await f.text());if(!j.p||!j.m)throw 0;if(!confirm('Esto reemplaza tu progreso actual. ¿Continuar?'))return;S=j;save();dlg.close();render()}catch(err){alert('Archivo no válido.')}};

/* ---------- eventos globales ---------- */
document.getElementById('bImp').onclick=()=>{ONEFILE=null;
 dlg.innerHTML=`<div class="dh"><h2>Importar transcripciones<small>.srt · .vtt · .txt · .json (Whisper)</small></h2><button class="btn" id="dx">Cerrar</button></div>
 <div class="db"><p>Elige muchos archivos a la vez. Los asocio a cada vídeo comparando el <b>nombre del archivo con el título</b>; los que no encuentre te los dejo asignar a mano.</p>
 <p class="hint">Consejo: nombra cada transcripción como el vídeo (p. ej. <i>Nodo Lerp.srt</i>). Con tiempos (.srt/.vtt) verás el minuto exacto de cada coincidencia.</p>
 <button class="btn pri" id="pick">Elegir archivos…</button></div>`;
 dlg.showModal();dlg.onclose=()=>{};
 dlg.querySelector('#dx').onclick=()=>dlg.close();
 dlg.querySelector('#pick').onclick=()=>{dlg.close();fTr.click()}};
document.getElementById('bTheme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';S.theme=r.dataset.theme;save()};
if(S.theme)document.documentElement.dataset.theme=S.theme;
document.getElementById('bCont').onclick=()=>{
 const it=ALL.find(i=>countable(i)&&(S.p[i.id]||0)===1)||ALL.find(i=>countable(i)&&i.type!=='recurso'&&(S.p[i.id]||0)===0);
 if(!it){alert('¡Lo has visto todo! 🎉');return}
 Q='';document.getElementById('q').value='';FILTER='all';OPEN.add(it.sec.id);render();
 const el=document.querySelector(`.row[data-id="${it.id}"]`);if(el){el.scrollIntoView({block:'center'});el.style.outline='2px solid var(--ac)';setTimeout(()=>el.style.outline='',1800)}};
let qt;document.getElementById('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{Q=e.target.value;render()},150)};
document.getElementById('chips').onclick=e=>{const c=e.target.closest('.chip');if(c){FILTER=c.dataset.f;render()}};
document.getElementById('app').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sid){d.open?OPEN.add(d.dataset.sid):OPEN.delete(d.dataset.sid)}},true);
document.getElementById('app').onclick=e=>{
 const sn=e.target.closest('.snip');if(sn){openDetail(sn.dataset.id,+sn.dataset.cue);return}
 const a=e.target.closest('[data-act]');if(!a)return;const id=a.closest('[data-id]').dataset.id;
 if(a.dataset.act==='st'){S.p[id]=((S.p[id]||0)+1)%3;save();render()}
 else if(a.dataset.act==='fav'){const m=S.m[id]||(S.m[id]={});m.fav=!m.fav;save();render()}
 else if(a.dataset.act==='open')openDetail(id)};
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

loadTR().then(render);render();
</script>
